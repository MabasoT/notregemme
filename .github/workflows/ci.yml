name: CI — Quality + Security Gate

# Vercel's GitHub integration builds and deploys every push (production
# for the default branch, previews for everything else). This workflow is
# the quality gate: a red run here means "don't merge".

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 08:00 SAST — weekly dependency audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Lint, types, security, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Security + quality gate
        run: bash scripts/security-check.sh
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://notregemme.co.za' }}
